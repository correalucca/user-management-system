<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro — Usuários</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="page page--cadastro">
  <main class="layout">
    <header class="header">
      <h1 class="header__title">Cadastro de usuários</h1>
      <a class="link" href="index.html">Sair</a>
    </header>

    <section class="card card--form">
      <h2 class="card__title card__title--sm">Novo usuário</h2>
      <form class="form" action="#" onsubmit="return false;">
        <label class="form__label" for="nome">Nome</label>
        <input class="form__input" type="text" id="nome" name="nome" placeholder="Nome completo">

        <label class="form__label" for="cpf">CPF</label>
        <input class="form__input" type="text" id="cpf" name="cpf" maxlength="14" placeholder="000.000.000-00" inputmode="numeric">

        <label class="form__label" for="emailCad">E-mail</label>
        <input class="form__input" type="email" id="emailCad" name="emailCad" placeholder="email@exemplo.com">

        <div class="form__actions">
          <button type="button" class="btn btn--secondary" id="btnCancelarEdicao" hidden>Cancelar edição</button>
          <button type="button" class="btn btn--primary" id="btnSalvar">Salvar</button>
        </div>
      </form>
    </section>

    <section class="card card--table">
      <h2 class="card__title card__title--sm">Usuários cadastrados</h2>
      <div class="table-wrap">
        <table class="table" id="tabelaUsuarios">
          <thead>
            <tr>
              <th>Nome</th>
              <th>CPF</th>
              <th>E-mail</th>
              <th class="table__actions">Ações</th>
            </tr>
          </thead>
          <tbody id="corpoTabela"></tbody>
        </table>
      </div>
      <p class="empty" id="msgVazia" hidden>Nenhum usuário cadastrado ainda.</p>
    </section>
  </main>
  <script src="js/controller.js"></script>
  <script>
    document.getElementById('btnSalvar').addEventListener('click', salvarUser);
    document.getElementById('btnCancelarEdicao').addEventListener('click', cancelarEdicao);
    document.getElementById('cpf').addEventListener('input', aplicarMascaraCpf);
    document.addEventListener('DOMContentLoaded', () => {
      carregarDadosArmazenados().then(() => criaLista());
    });
  </script>
</body>
</html>
